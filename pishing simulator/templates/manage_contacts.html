{% extends 'base.html' %}

{% block title %}Gérer les contacts{% endblock %}

{% block content %}
<div class="container">
    <h1>Gérer les contacts</h1>
    
    <!-- Formulaire pour ajouter un contact -->
    <form method="POST">
        <div class="form-group">
            <label for="name">Nom :</label>
            <input type="text" id="name" name="name" placeholder="Nom et prénom" required>
        </div>
        <div class="form-group">
            <label for="email">E-mail :</label>
            <input type="email" id="email" name="email" placeholder="Adresse e-mail" required>
        </div>
        <div class="form-group">
            <label for="phone">Téléphone :</label>
            <input type="text" id="phone" name="phone" placeholder="Numéro de téléphone">
        </div>
        <button type="submit" class="btn">Ajouter un contact</button>
    </form>

    <!-- Liste des contacts existants -->

    <ul>
        {% for contact in contacts %}
        <li>
            {{ contact.name }} - {{ contact.email }} - {{ contact.phone }}
            <form method="POST" action="{{ url_for('delete_contact', contact_id=contact.id) }}" style="display:inline;">
                <button type="submit" style="color:red; background:none; border:none; cursor:pointer;">
                    <i class="fas fa-trash-alt"></i> Supprimer
                </button>
            </form>
            <form method="GET" action="{{ url_for('edit_contact', contact_id=contact.id) }}" style="display:inline;">
                <button type="submit" style="color:blue; background:none; border:none; cursor:pointer;">
                    <i class="fas fa-edit"></i> Modifier
                </button>
            </form>
        </li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
