<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <a href="{{ url_for('index') }}" class="logo">
            PhishinGuard
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo" class="nav-logo">
        </a>

        <ul class="nav-links">
            <li><a href="{{ url_for('dashboard') }}" class="link-12">Tableau de bord</a></li>
            <li><a href="{{ url_for('create_campaign') }}" class="link-12">Compagne</a></li>
            <li><a href="{{ url_for('manage_contacts') }}" class="link-12">Contacts</a></li>
            <li><a href="{{ url_for('manage_apis') }}" class="link-12">API</a></li>
            {% if show_analytics %}
            <li><a href="{{ url_for('analytics') }}" class="link-12">Analytique</a></li>
            {% endif %}
            <li><a href="{{ url_for('simulate_phishing') }}" class="link-12">Phishing</a></li>
        </ul>
    </nav>

    <!-- Bottom Navigation for Mobile -->
    <div class="mobile-nav">
        <div class="mobile-nav">
            <a href="{{ url_for('dashboard') }}" class="nav-btn">
                <i class="fas fa-tachometer-alt"></i><span>Dashboard</span>
            </a>
            <a href="{{ url_for('create_campaign') }}" class="nav-btn">
                <i class="fas fa-plus-circle"></i><span>Campagne</span>
            </a>
            <a href="{{ url_for('manage_contacts') }}" class="nav-btn">
                <i class="fas fa-address-book"></i><span>Contacts</span>

            <a href="{{ url_for('manage_apis') }}" class="nav-btn">
                <i class="fas fa-cogs"></i><span>API</span>
            </a>
            <a href="{{ url_for('simulate_phishing') }}" class="nav-btn">
                <i class="fas fa-fish"></i><span>Phishing</span>
            </a>
            {% if show_analytics %}
            <a href="{{ url_for('analytics') }}" class="nav-btn">
                <i class="fas fa-chart-bar"></i><span>Analytique</span>
            </a>
            {% endif %}
        </div>
        
    </div>

    <!-- Main Content -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <script>
        // Menu toggle for burger menu
        document.addEventListener("DOMContentLoaded", () => {
            const menuToggle = document.querySelector('.menu-toggle');
            const navLinks = document.querySelector('.nav-links');

            menuToggle.addEventListener('click', () => {
                navLinks.classList.toggle('active');
            });
        });
    </script>
</body>
</html>
