{% extends 'base.html' %}

{% block title %}Gérer les API{% endblock %}

{% block content %}
<div class="container">
    <h1>Gérer les API</h1>
    <form method="POST">
        <div class="form-group">
            <label for="name">Nom :</label>
            <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
            <label for="api_type">Type d'API :</label>
            <select id="api_type" name="api_type" required>
                <option value="email">Email</option>
                <option value="sms">SMS</option>
            </select>
        </div>
        <div class="form-group">
            <label for="api_key">Clé API :</label>
            <input type="text" id="api_key" name="api_key" required>
        </div>
        <div class="form-group">
            <label for="api_secret">Secret API :</label>
            <input type="text" id="api_secret" name="api_secret" required>
        </div>
        <div class="form-group">
            <label for="api_url">URL API :</label>
            <input type="text" id="api_url" name="api_url" required>
        </div>
        <button type="submit">Ajouter API</button>
    </form>
</div>
{% endblock %}
